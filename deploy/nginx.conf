# Configuration nginx pour www.maxpavage.be (site statique Astro)
# À inclure dans votre nginx Hetzner (server block) ou à utiliser via le Dockerfile fourni.

server {
    listen 80;
    server_name maxpavage.be www.maxpavage.be;

    # Domaine nu -> www (canonique, importante pour le SEO)
    if ($host = maxpavage.be) {
        return 301 https://www.maxpavage.be$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---- Redirections 301 des anciennes URLs Odoo (préserve SEO + Google Ads) ----
    location = /our-services { return 301 /; }
    location = /nos-réalisation { return 301 /nos-realisations; }
    location = /nos-r%C3%A9alisation { return 301 /nos-realisations; }
    location = /blog/realisations-3 { return 301 /nos-realisations; }
    location = /contact { return 301 /contactus; }
    # Les flux RSS du blog Odoo n'existent plus
    location ~ ^/blog/.*/feed$ { return 301 /nos-realisations; }

    # ---- Cache long pour les assets fingerprintés par Astro ----
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- Pages HTML : URLs sans extension (build format: 'file') ----
    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # ---- Proxy OAuth pour l'admin Decap CMS (voir deploy/README.md) ----
    # Décommentez une fois le service oauth-proxy lancé (docker-compose)
    # location /oauth/ {
    #     proxy_pass http://127.0.0.1:8788/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    # }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
