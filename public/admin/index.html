<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration | Max Pavage</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/heic-to@1.5.2/dist/iife/heic-to.js"></script>
    <script>
      // Convertit automatiquement les photos HEIC/HEIF (iPhone) en JPEG avant
      // que Decap CMS ne les prenne en charge. Sans ça, Decap accepte l'input
      // mais rejette silencieusement le fichier (aucune vignette, aucun
      // commit) car les navigateurs ne savent pas décoder le HEIC.
      //
      // On intercepte l'évènement "change" en phase de capture sur
      // `document`, donc avant le gestionnaire interne de Decap (attaché en
      // phase de bulle) : on bloque l'évènement d'origine, on convertit le ou
      // les fichiers HEIC en JPEG, puis on réinjecte un nouvel évènement
      // "change" avec les fichiers convertis pour que Decap le traite
      // normalement.
      //
      // heic-to (et non heic2any, plus simple mais qui échoue sur les photos
      // HDR récentes type iPhone 16 Pro) embarque une build à jour de libheif
      // en WebAssembly.
      (() => {
        const processed = new WeakSet();

        const isHeic = (file) => {
          const type = (file.type || '').toLowerCase();
          const name = (file.name || '').toLowerCase();
          return type === 'image/heic' || type === 'image/heif' || /\.hei[cf]$/.test(name);
        };

        const convertToJpeg = async (file) => {
          if (!isHeic(file) || processed.has(file)) return file;
          try {
            const blob = await window.HeicTo({ blob: file, type: 'image/jpeg', quality: 0.9 });
            const newName = file.name.replace(/\.hei[cf]$/i, '.jpg');
            const jpegFile = new File([blob], newName, { type: 'image/jpeg' });
            processed.add(jpegFile);
            return jpegFile;
          } catch (err) {
            console.error('Échec de la conversion HEIC → JPEG pour', file.name, err);
            processed.add(file);
            return file;
          }
        };

        document.addEventListener(
          'change',
          (event) => {
            const input = event.target;
            if (!(input instanceof HTMLInputElement) || input.type !== 'file') return;
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            if (!files.some(isHeic) || files.every((f) => processed.has(f))) return;

            event.stopImmediatePropagation();
            event.preventDefault();

            Promise.all(files.map(convertToJpeg)).then((newFiles) => {
              const dt = new DataTransfer();
              newFiles.forEach((f) => dt.items.add(f));
              input.files = dt.files;
              input.dispatchEvent(new Event('change', { bubbles: true }));
            });
          },
          true,
        );
      })();
    </script>
    <script>
      // Aperçu réaliste des réalisations : reproduit la mise en page réelle
      // de src/pages/nos-realisations/[slug].astro (mêmes classes CSS) au
      // lieu de l'aperçu générique de Decap. Le CSS associé est dans
      // preview.css — c'est une copie adaptée de src/styles/global.css et du
      // <style> de [slug].astro, à remettre à jour si ces fichiers changent
      // significativement.
      CMS.registerPreviewStyle(
        'https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto&display=swap',
      );
      CMS.registerPreviewStyle('preview.css');

      const TAG_LABELS = {
        'amenagements-exterieurs-1': 'Aménagements extérieurs',
        'terrassements-2': 'Terrassements',
        'maconneries-3': 'Maçonneries',
        'tapis-de-pierre-6': 'Tapis de pierre',
      };

      const RealisationPreview = createClass({
        render() {
          const { entry, getAsset, widgetFor } = this.props;
          const title = entry.getIn(['data', 'title']) || '';
          const location = entry.getIn(['data', 'location']);
          const tag = entry.getIn(['data', 'tag']);
          const date = entry.getIn(['data', 'date']);
          const coverPath = entry.getIn(['data', 'cover']);
          const coverAlt = entry.getIn(['data', 'coverAlt']) || title;
          const gallery = entry.getIn(['data', 'gallery']);
          const videos = entry.getIn(['data', 'videos']);

          const dateLabel = date
            ? new Date(date).toLocaleDateString('fr-BE', { day: 'numeric', month: 'long', year: 'numeric' })
            : '';

          return h(
            'article',
            {},
            h('h1', {}, title),
            h(
              'p',
              { className: 'realisation__meta' },
              tag && h('span', { className: 'realisation__tag' }, TAG_LABELS[tag] || tag),
              location && h('span', {}, ` · ${location}`),
              dateLabel && h('span', {}, ` · ${dateLabel}`),
            ),
            coverPath &&
              h('img', {
                className: 'realisation__cover',
                src: getAsset(coverPath).toString(),
                alt: coverAlt,
              }),
            h('div', { className: 'realisation__content' }, widgetFor('body')),
            videos &&
              videos.size > 0 &&
              h(
                'div',
                { className: 'realisation__videos' },
                videos
                  .map((video, i) =>
                    h(
                      'div',
                      { key: i, className: 'realisation__video-wrapper' },
                      h('p', {}, `🎬 ${video.get('label') || video.get('url')}`),
                    ),
                  )
                  .toArray(),
              ),
            gallery &&
              gallery.size > 0 &&
              h(
                'div',
                { className: 'realisation__gallery' },
                gallery
                  .map((item, i) => {
                    const src = item.get('src');
                    if (!src) return null;
                    return h('img', {
                      key: i,
                      className: 'realisation__gallery-img',
                      src: getAsset(src).toString(),
                      alt: item.get('alt') || title,
                    });
                  })
                  .toArray(),
              ),
          );
        },
      });

      CMS.registerPreviewTemplate('realisations', RealisationPreview);
    </script>
    <script>
      // Masquer le bouton "Supprimer" dans la médiathèque
      // Decap CMS injecte son UI dans un iframe — on observe les mutations DOM
      // pour injecter du CSS dès que le shadow root est disponible.
      const observer = new MutationObserver(() => {
        const frame = document.querySelector('iframe');
        if (!frame) return;
        try {
          const doc = frame.contentDocument;
          if (!doc || doc.querySelector('#no-delete-style')) return;
          const style = doc.createElement('style');
          style.id = 'no-delete-style';
          // Bouton "Delete" dans la médiathèque (libellé "Delete" ou icône corbeille)
          style.textContent = `
            [class*="DeleteButton"] { display: none !important; }
          `;
          doc.head.appendChild(style);
        } catch {
          // Accès cross-origin bloqué — ne rien faire
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
