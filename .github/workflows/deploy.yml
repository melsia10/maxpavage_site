name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert HEIC images to JPEG
        run: |
          if ! find src \( -name "*.heic" -o -name "*.HEIC" \) -print -quit | grep -q .; then
            echo "Aucun fichier HEIC trouvé."
            exit 0
          fi
          echo "Fichiers HEIC détectés — installation du convertisseur..."
          sudo apt-get install -y -q libheif-examples
          while IFS= read -r -d $'\0' heic; do
            jpg="${heic%.*}.jpg"
            echo "Conversion : $heic → $jpg"
            heif-convert "$heic" "$jpg"
            rm "$heic"
            rel_heic="$(basename "$heic")"
            rel_jpg="$(basename "$jpg")"
            find src -name "*.md" -exec sed -i "s|${rel_heic}|${rel_jpg}|g" {} +
          done < <(find src \( -name "*.heic" -o -name "*.HEIC" \) -print0)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: convert HEIC images to JPEG [skip ci]"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Le déploiement ne tourne que si les secrets SSH Hetzner sont configurés
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Hetzner via rsync
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "Secrets Hetzner non configurés — déploiement ignoré."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete dist/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"
